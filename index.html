<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub - Where the world builds software</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.5;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Navigation Bar */
        header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #f0f6fc;
        }

        .nav-links {
            display: flex;
            gap: 16px;
            list-style: none;
        }

        .nav-links a {
            color: #8b949e;
            font-weight: 500;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #c9d1d9;
            text-decoration: none;
        }

        .search-bar {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 5px 12px;
            color: #c9d1d9;
            font-size: 14px;
            width: 240px;
        }

        .btn-signin {
            color: #f0f6fc;
            font-size: 14px;
        }

        .btn-signup {
            border: 1px solid #30363d;
            padding: 5px 12px;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 14px;
            font-weight: 500;
        }

        .btn-signup:hover {
            background-color: #21262d;
            text-decoration: none;
        }

        /* Main Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 32px;
        }
